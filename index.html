<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UVCCM TIA DSM - Usajili wa Wanachama</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-green-700">UVCCM TIA DSM</h1>
            <p class="text-sm text-gray-600">Mfumo wa Usajili wa Wanachama</p>
        </div>
        
        <form id="registrationForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Majina Kamili</label>
                <input type="text" placeholder="Mfano: John Joseph" required class="w-full mt-1 p-2 border rounded-md focus:ring-green-500 focus:border-green-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Kozi Unayosoma</label>
                <input type="text" placeholder="Mfano: Diploma in Accounting" required class="w-full mt-1 p-2 border rounded-md focus:ring-green-500 focus:border-green-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Mwaka wa Masomo</label>
                <select class="w-full mt-1 p-2 border rounded-md focus:ring-green-500 focus:border-green-500">
                    <option>Mwaka wa 1</option>
                    <option>Mwaka wa 2</option>
                    <option>Mwaka wa 3</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Namba ya Simu</label>
                <input type="tel" placeholder="07XXXXXXXX" required class="w-full mt-1 p-2 border rounded-md focus:ring-green-500 focus:border-green-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Namba ya Kadi ya Chama (Kama ipo)</label>
                <input type="text" placeholder="SGL-XXXXX" class="w-full mt-1 p-2 border rounded-md focus:ring-green-500 focus:border-green-500">
            </div>

            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md font-semibold hover:bg-green-700">Hifadhi Taarifa</button>
        </form>
    </div>
</body>
</html>
